services:
  ai-house-v3:
    build: .
    ports:
      - "8030:8000"
    env_file:
      - .env
    environment:
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_CATALOG_ID=${YANDEX_CATALOG_ID}
      - YANDEX_MODEL=${YANDEX_MODEL:-yandexgpt-lite}
      - LLM_PROVIDER=${LLM_PROVIDER:-yandex}
      - GRAPH_SUPERVISOR_MAX_STEPS=${GRAPH_SUPERVISOR_MAX_STEPS:-6}
      - AGENT_DB_ENABLED=${AGENT_DB_ENABLED:-true}
      - MCP_AUTH_URL=${MCP_AUTH_URL:-http://auth-mcp:8000/mcp}
      - MCP_SMS_URL=${MCP_SMS_URL:-http://sms-mcp:8000/mcp}
    depends_on:
      - auth-mcp
      - sms-mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  auth-mcp:
    build: .
    command: python -m app.mcp_services.auth_server
    ports:
      - "8031:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_DSN=${POSTGRES_MCP_DSN_AUTH}
      - DB_QUERY_TIMEOUT_SECONDS=${DB_QUERY_TIMEOUT_SECONDS:-5}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_TRANSPORT=streamable-http
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  sms-mcp:
    build: .
    command: python -m app.mcp_services.sms_server
    ports:
      - "8032:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_DSN=${POSTGRES_MCP_DSN_MAIN}
      - DB_QUERY_TIMEOUT_SECONDS=${DB_QUERY_TIMEOUT_SECONDS:-5}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_TRANSPORT=streamable-http
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3010:8080"
    environment:
      - OPENAI_API_BASE_URL=http://ai-house-v3:8000/v1
      - OPENAI_API_KEY=ai-house-v3-local-key
      - WEBUI_AUTH=False
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - open-webui-data:/app/backend/data
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      - ai-house-v3
    restart: unless-stopped

volumes:
  open-webui-data:
